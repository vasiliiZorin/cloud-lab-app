<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Lab Guestbook</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
  h1 { font-size: 1.4rem; }
  .meta { color: #888; font-size: 0.85rem; margin-bottom: 24px; }
  .tier { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin-right: 6px; }
  .tier.app { background: #dbeafe; color: #1e40af; }
  .tier.db { background: #dcfce7; color: #166534; }
  .tier.cache { background: #fef3c7; color: #92400e; }
  form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  input, textarea { font: inherit; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  button { font: inherit; padding: 8px 16px; border: 0; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; width: fit-content; }
  button:disabled { opacity: 0.5; cursor: default; }
  ul { list-style: none; padding: 0; }
  li { padding: 10px 0; border-bottom: 1px solid #eee; }
  li .name { font-weight: 600; }
  li .when { color: #999; font-size: 0.8rem; }
  #status { font-size: 0.85rem; color: #b91c1c; min-height: 1.2em; }
</style>
</head>
<body>
  <h1>Cloud Lab Guestbook</h1>
  <p class="meta">
    <span class="tier app">app server</span>writes/reads via
    <span class="tier db">database</span>and tracks visits via
    <span class="tier cache">cache</span>· visits: <strong id="visits">…</strong>
  </p>

  <form id="form">
    <input id="name" placeholder="Your name" maxlength="80" required>
    <textarea id="message" placeholder="Say something" maxlength="500" required></textarea>
    <button type="submit">Post</button>
  </form>
  <div id="status"></div>

  <ul id="messages"></ul>

  <script>
    const statusEl = document.getElementById('status');

    async function loadMessages() {
      const res = await fetch('/api/messages');
      const items = await res.json();
      const list = document.getElementById('messages');
      list.innerHTML = '';
      for (const item of items) {
        const li = document.createElement('li');
        const when = new Date(item.created_at).toLocaleString();
        li.innerHTML = `<div class="name">${escapeHtml(item.name)}</div>
          <div>${escapeHtml(item.message)}</div>
          <div class="when">${when}</div>`;
        list.appendChild(li);
      }
    }

    async function bumpVisit() {
      const res = await fetch('/api/visit', { method: 'POST' });
      const data = await res.json();
      document.getElementById('visits').textContent = data.visits ?? '?';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = '';
      const name = document.getElementById('name').value;
      const message = document.getElementById('message').value;
      const res = await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, message }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        statusEl.textContent = err.error || 'Something went wrong.';
        return;
      }
      document.getElementById('form').reset();
      loadMessages();
    });

    loadMessages();
    bumpVisit();
  </script>
</body>
</html>
